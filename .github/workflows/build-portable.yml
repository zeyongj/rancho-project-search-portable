name: Build portable applications

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run application tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build Windows portable archive
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Rancho-Project-Search-Windows-x64
          path: release/Rancho-Project-Search-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
          - runner: macos-15-intel
            label: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run application tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build macOS portable archive
        run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rancho-Project-Search-macOS-${{ matrix.label }}
          path: release/Rancho-Project-Search-macOS-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/**/*.zip --generate-notes --verify-tag

